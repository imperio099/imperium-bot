services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: imperium
      POSTGRES_USER: imperium
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [imperium_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imperium -d imperium"]
      interval: 5s
      timeout: 5s
      retries: 10
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
volumes:
  imperium_data:
